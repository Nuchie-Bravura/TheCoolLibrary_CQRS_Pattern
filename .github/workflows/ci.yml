name: .NET CI/CD

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: ?? Checkout code
      uses: actions/checkout@v4
    
    - name: ?? Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
    
    - name: ?? Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: ?? Restore dependencies
      run: dotnet restore
    
    - name: ??? Build solution
      run: dotnet build --configuration Release --no-restore --warnaserror
    
    - name: ?? Run unit tests
      run: dotnet test CoolLibraryTests/CoolLibraryUnitaryTests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"
    
    - name: ?? Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: MSTest Results
        path: '**/test-results.trx'
        reporter: dotnet-trx
        fail-on-error: true
    
    - name: ?? Code Coverage Report
      uses: codecov/codecov-action@v4
      if: always()
      with:
        files: '**/coverage.cobertura.xml'
        fail_ci_if_error: false
        verbose: true
