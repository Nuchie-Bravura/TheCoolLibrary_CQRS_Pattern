name: .NET CI/CD

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔧 Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: 📦 Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: 📚 Restore dependencies
      run: dotnet restore

    - name: 🏗️ Build solution
      run: dotnet build --configuration Release --no-restore
      # <-- removido --warnaserror para evitar que warnings rompan el build en CI

    - name: 🧪 Run unit tests (TRX + cobertura)
      run: |
        dotnet test CoolLibraryTests/CoolLibraryUnitaryTests.csproj \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --logger "trx;LogFileName=TestResults/test-results.trx" \
          --collect:"XPlat Code Coverage"
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    - name: 📊 Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: MSTest Results
        path: '**/TestResults/**/*.trx'
        reporter: dotnet-trx
        fail-on-error: true

    - name: 🔎 Show found coverage files (debug)
      if: always()
      run: |
        echo "Coverage files:"
        find . -type f -name "coverage.cobertura.xml" -print || true
        ls -R TestResults || true

    - name: 📈 Code Coverage Report (Codecov)
      if: always()
      uses: codecov/codecov-action@v4
      continue-on-error: true
      with:
        files: '**/coverage.cobertura.xml'
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
