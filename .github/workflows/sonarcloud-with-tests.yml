name: SonarCloud Analysis

on:
  push:
  pull_request:

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'
      
      - name: Cache SonarCloud scanner
        uses: actions/cache@v4
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      
      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory -Force
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner
      
      - name: Install coverage tool
        run: dotnet tool install --global dotnet-coverage
      
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.LIBRARYCQRS }}
        shell: powershell
        run: |
          .\.sonar\scanner\dotnet-sonarscanner begin `
            /k:"Nuchie-Bravura_TheCoolLibrary_CQRS_Pattern" `
            /o:"nuchie-bravura" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" `
            /d:sonar.exclusions="**/obj/**,**/bin/**,**/Migrations/**,**/*.Designer.cs,**/wwwroot/**,**/AssemblyInfo.cs" `
            /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs,**/AssemblyInfo.cs,**/*Tests/**,**/*Test.cs,**/GlobalUsings.g.cs" `
            /d:sonar.cpd.exclusions="**/Migrations/**" `
            /d:sonar.verbose=true
          
          dotnet build --configuration Release --no-restore
          
          dotnet-coverage collect "dotnet test --configuration Release --no-build --verbosity normal" -f xml -o "coverage.xml"
          
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
