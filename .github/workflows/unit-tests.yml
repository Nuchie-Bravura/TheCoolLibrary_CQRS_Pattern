name: Unit Tests

on:
  push:
    branches: [ main ]         
  pull_request:
    branches: [ main ]        

# Add permissions for pull request checks
permissions:
  contents: read
  checks: write
  pull-requests: write
  statuses: write

jobs:
  unit-tests:
    name: Run Unit Tests (.NET 9)
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔧 Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: 📦 Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: 📚 Restore dependencies
      run: dotnet restore

    - name: 🏗️ Build
      run: dotnet build --no-restore --configuration Release

    - name: 🧪 Run CreateBookService Tests
      run: |
        dotnet test CoolLibraryTests/CoolLibraryUnitaryTests.csproj \
          --no-build \
          --configuration Release \
          --verbosity detailed \
          --logger "console;verbosity=detailed" \
          --filter "FullyQualifiedName~CreateBookServiceTests"

    - name: 🧪 Run All Unit Tests with Coverage
      run: |
        dotnet test CoolLibraryTests/CoolLibraryUnitaryTests.csproj \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --logger "trx;LogFileName=test-results.trx" \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    - name: 📊 Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: '**/test-results.trx'
        check_name: 'Unit Test Results'
        comment_mode: off

    - name: 🔎 Show TestResults & Coverage files (debug)
      if: always()
      run: |
        echo "List TestResults:"
        find ./TestResults -maxdepth 3 -type f -print || true
        echo "Find coverage files:"
        find . -type f -name "coverage.cobertura.xml" -print || true

    - name: 📈 Upload Coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v4
      continue-on-error: true
      with:
        directory: ./TestResults
        files: '**/coverage.cobertura.xml'
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
